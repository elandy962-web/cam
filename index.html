function updWatch(w){if(!w)return;const f=()=>{if(w.state==='installed')updAsk(w)};w.addEventListener('statechange',f);f()}
function updCheck(){if(!navigator.onLine)return Promise.resolve(null);if(UPD)UPD.update().catch(()=>{});
 return fetch('index.html?upd='+Date.now(),{cache:'reload'}).then(r=>r.ok?r.text():'').then(t=>{const m=/APP_VERSION\s*=\s*'([0-9]+(?:\.[0-9]+)*)'/.exec(t||'');if(m&&vnewer(m[1],APP_VERSION)){updShow(m[1]);return m[1]}return (UPD&&UPD.waiting)?(UPDV||'nueva'):''}).catch(()=>null)}
function updGo(){const b=document.getElementById('updb');if(b)b.innerHTML='<span>Actualizando…</span>';const w=UPD&&UPD.waiting;
 if(w){let done=false;const go=()=>{if(!done){done=true;location.reload()}};navigator.serviceWorker.addEventListener('controllerchange',go);w.postMessage('skip');setTimeout(go,5000);return}
 cloudRepair()}
function updManual(){waitS('Buscando actualización…');updCheck().then(v=>{if(v){closeS();updGo()}else if(v===null)info('Sin internet: no se pudo buscar la actualización.');else document.getElementById('sheet').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeS()"><div><h3 style="margin:0 0 8px">Ya tienes la versión más reciente (${APP_VERSION}).</h3><div style="font-size:13px;color:var(--mu);margin-bottom:10px">Si la app se ve rara o no carga bien, puedes forzar una recarga completa. Tus datos no se borran.</div><button class="btn" onclick="cloudRepair()">Forzar recarga</button><button class="btn" onclick="closeS()">OK</button></div></div>`})}
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{UPD=reg;if(reg.waiting)updAsk(reg.waiting);reg.addEventListener('updatefound',()=>updWatch(reg.installing));updCheck()}).catch(()=>{})})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')updCheck()});
addEventListener('online',()=>updCheck());setInterval(updCheck,30*60000);
</script>
</body></html>
