<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Softball en vivo</title>
<style>
:root{--bg:#071523;--card:#101f2d;--card2:#0c1925;--tx:#f7f8fa;--mu:#aeb8c2;--ac:#ff5a00;--ac2:#ffb000;--rd:#e43d30;--bd:#294052;--glow:rgba(255,90,0,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef1f4;--card:#fff;--card2:#f7f8fa;--tx:#101820;--mu:#687580;--ac:#f05200;--ac2:#e6a000;--rd:#c9352b;--bd:#d7dfe5;--glow:rgba(240,82,0,.14)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:8px 10px 80px;max-width:520px;margin:0 auto;background-image:radial-gradient(circle at 10% 0%,rgba(255,90,0,.10),transparent 28%),radial-gradient(circle at 100% 45%,rgba(255,176,0,.06),transparent 25%)}
.brand{display:flex;align-items:center;gap:10px;padding:8px 4px 12px}
.brand-mark{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(145deg,var(--ac),#c83d00);color:#fff;font-size:24px;font-weight:900;box-shadow:0 5px 18px var(--glow)}
.brand-name{font-size:21px;line-height:1;font-weight:950;font-style:italic;letter-spacing:-.7px;color:#fff}
.brand-name span{color:var(--ac)}
.brand-sub{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--mu);margin-top:4px}
.card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 5px 18px rgba(0,0,0,.14);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;width:46px;height:3px;background:var(--ac);border-radius:0 0 4px 0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px 2px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-weight:700;font-size:14px}
.tabs button.on{background:linear-gradient(135deg,var(--ac),#d94200);color:#fff;border-color:var(--ac);box-shadow:0 4px 12px var(--glow)}
.sb{display:flex;align-items:center;justify-content:space-between;text-align:center}
.sb .t{flex:1}.sb .n{font-size:12px;color:var(--mu);font-weight:700}.sb .s{font-size:38px;font-weight:900;line-height:1;color:#fff}
.sb .pm button{width:30px;height:26px;margin:2px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.mid{flex:0 0 90px}.mid b{font-size:15px;color:var(--ac2)}
.outs i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ac2);margin:0 2px}.outs i.f{background:var(--ac2)}
.dia{position:relative;height:150px;margin:6px auto;width:170px}
.dia .sq{position:absolute;left:35px;top:20px;width:100px;height:100px;border:2px solid rgba(255,176,0,.35);transform:rotate(45deg);background:color-mix(in srgb,var(--ac) 14%,transparent);box-shadow:0 0 25px rgba(255,90,0,.08)}
.base{position:absolute;width:44px;height:44px;border-radius:8px;transform:translate(-50%,-50%) rotate(45deg);border:2px solid var(--mu);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0}
.base span{transform:rotate(-45deg);font-size:10px;font-weight:800;color:var(--tx);line-height:1.1;text-align:center;max-width:40px;overflow:hidden}
.base.on{background:var(--ac2);border-color:var(--ac2);box-shadow:0 0 14px rgba(255,176,0,.25)}.base.on span{color:#111}
.b1{left:136px;top:70px}.b2{left:85px;top:20px}.b3{left:34px;top:70px}
.home{position:absolute;left:85px;top:122px;width:22px;height:22px;transform:translate(-50%,-50%) rotate(45deg);background:var(--ac);border-radius:3px;box-shadow:0 0 12px var(--glow)}
.msg{min-height:38px;text-align:center;font-size:14px;font-weight:700;color:var(--ac2);padding:4px 0}
.bat{display:flex;justify-content:space-between;align-items:center}
.bat .nm{font-size:20px;font-weight:900}.bat .sm{font-size:12px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.grid button{padding:16px 0;border-radius:11px;border:1px solid rgba(255,255,255,.05);font-size:16px;font-weight:900;color:#fff;background:linear-gradient(145deg,var(--ac),#d94300);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.grid .o{background:linear-gradient(145deg,var(--rd),#b92720)}.grid .w{background:linear-gradient(145deg,var(--ac2),#df9200);color:#111}.grid .g{background:linear-gradient(145deg,#425261,#33424f)}
button:active{opacity:.72;transform:scale(.98)}
.row{display:flex;gap:8px}.row button,.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:14px}
input{padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;flex:2;min-width:0;outline:none}
input:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--glow)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.pl button{border:none;background:none;color:var(--rd);font-size:18px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 6px;text-align:center;white-space:nowrap}th{color:var(--ac2);font-size:11px;text-transform:uppercase}td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:800}
tr+tr td{border-top:1px solid var(--bd)}
.leader-stat{font-weight:900;color:var(--ac2)!important;background:rgba(255,176,0,.10)}
.ev{display:inline-block;margin:1px;padding:2px 5px;border-radius:5px;font-size:12px;font-weight:800}.ev.h{background:var(--ac);color:#fff}.ev.o{background:var(--rd);color:#fff}.ev.w{background:var(--ac2);color:#111}.ev.r{color:var(--ac2);font-size:15px;padding:0 2px}.ev small{font-weight:600;opacity:.9}
.sheet{position:fixed;inset:0;background:rgba(2,8,14,.72);display:flex;align-items:flex-end;z-index:9;backdrop-filter:blur(3px)}
.sheet>div{background:var(--card);width:100%;max-width:520px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;border:1px solid var(--bd);border-bottom:0;box-shadow:0 -10px 35px rgba(0,0,0,.25)}
.sheet h3{margin:0 0 10px}.sheet .btn{margin-bottom:8px;width:100%;display:block}
.share-stats{width:100%;margin:12px 0;background:linear-gradient(135deg,var(--ac),#d93f00);color:#fff!important;border-color:var(--ac)!important;font-weight:900;box-shadow:0 6px 18px rgba(255,90,0,.25)}
.cloudbtn{margin-left:auto;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:800}.cloudbtn.ok{color:var(--ac2);border-color:var(--ac2)}
.sheet input{width:100%;margin-bottom:8px}
</style></head><body>
<div class="brand"><div class="brand-mark">♛</div><div><div class="brand-name">TEAM <span>PERVERSOS</span></div></div><button id="cloud" class="cloudbtn" onclick="cloudSheet()">☁ Local</button></div>
<div class="tabs"><button id="t0" onclick="tab(0)">Juego</button><button id="t1" onclick="tab(1)">Estadísticas</button><button id="t2" onclick="tab(2)">Equipo</button><button id="t3" onclick="tab(3)">Historial</button></div>
<div id="app"></div><div id="sheet"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const KEY='softball_en_vivo_v1';
let S={players:[],idx:0,inning:1,outs:0,bases:[null,null,null],us:0,them:0,msg:'Agrega jugadores en la pestaña Equipo'};
let hist=[],T=0,ev=[];
try{const d=localStorage.getItem(KEY);if(d)S=JSON.parse(d)}catch(e){}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
S.games=S.games||[];S.team=S.team||"";S.roster=S.roster||S.players.map(p=>({id:p.id,name:p.name}));S.rival=S.rival||"";S.date=S.date||today();let V=null,ST=0,IBLOB=null,IBLOB_NAME='resultados.png';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof cloudPush==='function')cloudPush()};
const P=id=>S.players.find(p=>p.id===id);
const cur=()=>S.players[S.idx%S.players.length];
const nxt=()=>{S.idx=(S.idx+1)%S.players.length};
const mk=n=>({id:Date.now()+Math.random(),name:n,log:[],AB:0,H:0,s1:0,s2:0,s3:0,hr:0,BB:0,K:0,R:0,RBI:0,SAC:0});
function run(rid,bid){const r=P(rid);r.R++;S.us++;(r.log=r.log||[]).push({i:S.inning,a:"◇",run:1});if(bid!=null)P(bid).RBI++;ev.push(r.name+' anotó')}
function out(){S.outs++;if(S.outs>=3){S.outs=0;S.inning++;S.bases=[null,null,null];ev.push('Cambio de entrada')}}
function act(fn){if(!S.players.length){tab(2);return}hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();ev=[];const b=cur(),inn=S.inning,r0=b.RBI,L0=(b.log=b.log||[]).length;const d=fn(b);const ab=AB_[d.slice(d.indexOf(': ')+2).toLowerCase()];if(ab)b.log.splice(L0,0,{i:inn,a:ab,rbi:b.RBI-r0});S.msg=d+(ev.length?' · '+ev.join(', '):'');save();render()}
function hit(n){const names=['','Sencillo','Doble','Triple','Jonrón'];act(b=>{b.AB++;b.H++;b[n==4?'hr':'s'+n]++;const nb=[null,null,null];for(let i=2;i>=0;i--){const r=S.bases[i];if(r!=null){const t=i+n;if(t>=3)run(r,b.id);else nb[t]=r}}if(n==4)run(b.id,b.id);else nb[n-1]=b.id;S.bases=nb;const d=b.name+': '+names[n];nxt();return d})}
function walk(err){act(b=>{if(err)b.AB++;else b.BB++;const bs=S.bases;if(bs[0]!=null){if(bs[1]!=null){if(bs[2]!=null)run(bs[2],err?null:b.id);bs[2]=bs[1]}bs[1]=bs[0]}bs[0]=b.id;const d=b.name+(err?': llega por error':': base por bolas');nxt();return d})}
function ko(){act(b=>{b.AB++;b.K++;out();nxt();return b.name+': ponchado'})}
function fo(){act(b=>{b.AB++;out();nxt();return b.name+': out'})}
function sac(){act(b=>{b.SAC++;if(S.bases[2]!=null&&S.outs<2){run(S.bases[2],b.id);S.bases[2]=null}out();nxt();return b.name+': sacrificio'})}
function undo(){if(!hist.length)return;S=JSON.parse(hist.pop());save();render()}
function runner(i){const r=P(S.bases[i]);if(!r)return;document.getElementById('sheet').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeS()"><div><h3>${r.name} en ${i+1}ª base</h3>
<button class="btn" onclick="rn(${i},'adv')">Avanza una base${i==2?' (anota)':''}</button>
<button class="btn" onclick="rn(${i},'run')">Anotó</button>
<button class="btn" onclick="rn(${i},'out')">Out en las bases</button>
<button class="btn" onclick="closeS()">Cancelar</button></div></div>`}
const closeS=()=>{document.getElementById('sheet').innerHTML=''};
function rn(i,a){closeS();hist.push(JSON.stringify(S));ev=[];const id=S.bases[i],n=P(id).name;let d;
if(a=='adv'){if(i==2){S.bases[2]=null;run(id,null);d=n+' avanza'}else if(S.bases[i+1]==null){S.bases[i+1]=id;S.bases[i]=null;d=n+' avanza a '+(i+2)+'ª'}else{hist.pop();return}}
else if(a=='run'){S.bases[i]=null;run(id,null);d=n+' anotó'}
else{S.bases[i]=null;(P(id).log=P(id).log||[]).push({i:S.inning,a:'OUT*'});out();d=n+' out en las bases'}
S.msg=d+(a=='adv'||a=='run'?'':(ev.length?' · '+ev.join(', '):''));save();render()}
function addP(){const el=document.getElementById('np'),v=el.value.trim();if(!v)return;S.players.push(mk(v));save();render()}
function delP(id){if(!confirm('¿Quitar jugador?'))return;S.players=S.players.filter(p=>p.id!==id);S.bases=S.bases.map(b=>b===id?null:b);S.idx=0;save();render()}
function newGame(){ask('¿Nuevo juego? Se borran las estadísticas y el marcador (los jugadores se quedan).',doNew,'Reiniciar')}
function doNew(){S.players=[];Object.assign(S,{idx:0,inning:1,outs:0,bases:[null,null,null],us:0,them:0,rival:'',date:today(),msg:'Nuevo juego · Lineup vacío'});hist=[];save();render()}
function opp(d){S.them=Math.max(0,S.them+d);save();render()}
function endGame(){document.getElementById('sheet').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeS()"><div><h3>Terminar juego</h3><div style="color:var(--mu);font-size:13px;margin-bottom:10px">${S.us} - ${S.them} vs ${esc(S.rival||'Rival')}. ¿Cómo terminó?</div>
<button class="btn" onclick="fin('Final normal')">Final normal</button>
<button class="btn" onclick="fin('KO / diferencia de carreras')">KO / diferencia de carreras</button>
<button class="btn" onclick="fin('Suspendido (lluvia o tiempo)')">Suspendido (lluvia o tiempo)</button>
<button class="btn" onclick="fin('Forfeit')">Forfeit</button>
<button class="btn" onclick="closeS()">Cancelar</button></div></div>`}
function fin(r){closeS();const g={id:Date.now(),team:S.team,rival:S.rival.trim()||'Rival',date:S.date||today(),us:S.us,them:S.them,inning:S.inning,reason:r,players:JSON.parse(JSON.stringify(S.players))};S.games.unshift(g);S.players=S.players.map(p=>({...mk(p.name),id:p.id}));Object.assign(S,{idx:0,inning:1,outs:0,bases:[null,null,null],us:0,them:0,rival:'',date:today(),msg:'Juego guardado en Historial'});hist=[];V=g.id;save();T=3;render()}
let CB=null;
function ask(msg,fn,lbl){CB=fn;document.getElementById('sheet').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeS()"><div><h3>${esc(msg)}</h3><button class="btn" style="color:var(--rd)" onclick="closeS();CB&&CB()">${lbl||'Sí, continuar'}</button><button class="btn" onclick="closeS()">Cancelar</button></div></div>`}
function delG(id){ask('¿Borrar este juego guardado?',()=>{S.games=S.games.filter(g=>g.id!==id);V=null;save();render()},'Borrar juego')}
const fd=d=>{const p=(d||'').split('-');return p.length==3?p[2]+'/'+p[1]+'/'+p[0]:d};
const res=g=>{const w=g.us>g.them,l=g.us<g.them;return `<span style="background:${w?'var(--ac)':l?'var(--rd)':'var(--mu)'};color:#fff;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700">${w?'G':l?'P':'E'}</span>`};
function statCols(){return ['JJ','AB','CA','CE','H','H1','H2','H3','HR','BB','K','SF','AVE']}
function statVals(p,gp){return [gp?(p.GP||0):1,p.AB||0,p.R||0,p.RBI||0,p.H||0,p.s1||0,p.s2||0,p.s3||0,p.hr||0,p.BB||0,p.K||0,p.SAC||0,avg(p)]}
function leaderMap(ps,gp){
 const vals=ps.map(p=>statVals(p,gp));
 const out={};
 for(let c=0;c<13;c++){
  if(c===0) continue;
  const nums=vals.map(v=>c===12?parseFloat(v[c])||0:Number(v[c])||0);
  if(!nums.length) continue;
  const max=Math.max(...nums);
  if(c===11){ // SF: only mark an actual positive leader
   if(max<=0) continue;
  }
  out[c]=new Set(nums.map((v,i)=>v===max&&max>0?i:null).filter(i=>i!==null));
 }
 return out;
}
const tbl=(ps,gp)=>{const cols=statCols(),leaders=leaderMap(ps,gp);return `<div class="card tw"><table><tr><th>Jugador</th>${cols.map(h=>`<th>${h}</th>`).join('')}</tr>${ps.map((p,i)=>{const v=statVals(p,gp);return `<tr><td>${esc(p.name)}</td>${v.map((z,j)=>{const lead=j>0&&leaders[j]&&leaders[j].has(i);return `<td class="${lead?'leader-stat':''}">${j===12?`<b>${z}</b>`:z}</td>`}).join('')}</tr>`}).join('')}</table></div>`}

function histHTML(){const g=S.games.find(x=>x.id===V);
if(g)return `<button class="btn" style="width:100%;margin-bottom:10px" onclick="V=null;render()">← Volver</button><div class="card"><b>${fd(g.date)} · vs ${esc(g.rival)}</b><div style="font-size:30px;font-weight:800;margin:4px 0">${g.us} - ${g.them} ${res(g)}</div><div style="color:var(--mu);font-size:13px">${g.reason} · ${g.inning} entradas</div></div>${mvpCard(g)}<button class="btn" style="width:100%;margin-bottom:10px;background:var(--ac);color:#fff;border-color:var(--ac)" onclick="mkImg(${g.id})">🖼 Crear imagen del día</button>${tbl(g.players)}${sumCard(g.players)}<button class="btn" style="width:100%;color:var(--rd)" onclick="delG(${g.id})">Borrar juego</button>`;
if(!S.games.length)return '<div class="card" style="color:var(--mu)">Aún no hay juegos guardados. Usa "Terminar juego" para guardar uno.</div>';
const dates=[...new Set(S.games.map(g=>g.date))];
return dates.map(date=>{const games=S.games.filter(g=>g.date===date);const first=games[0];return `<div class="card" style="padding-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>${fd(date)}</b><button class="btn" style="flex:0 0 auto;padding:8px 10px;background:var(--ac);color:#fff;border-color:var(--ac)" onclick="event.stopPropagation();mkImg(${first.id})">🖼 Juegos del día</button></div>${games.map(g=>`<div onclick="V=${g.id};render()" style="cursor:pointer;border-top:1px solid var(--bd);padding:10px 0 2px"><div style="display:flex;justify-content:space-between;align-items:center"><b>vs ${esc(g.rival)}</b>${res(g)}</div><div style="font-size:24px;font-weight:800">${g.us} - ${g.them}</div><div style="color:var(--mu);font-size:13px">${g.reason} · ${g.inning} entradas</div></div>`).join('')}</div>`}).join('')}
function addR(){const el=document.getElementById('np'),v=el.value.trim();if(!v)return;S.roster.push({id:Date.now()+Math.random(),name:v});save();render()}
function toLine(id){const r=S.roster.find(x=>x.id===id);if(!r||P(id))return;S.players.push({...mk(r.name),id});save();render()}
function fromLine(id,force){const p=P(id);if(!p)return;if(!force&&p.AB+p.BB+p.R+p.SAC>0){ask('Este jugador ya tiene estadísticas en este juego. ¿Quitarlo del lineup?',()=>fromLine(id,true),'Quitar');return}const c=cur().id;S.players=S.players.filter(x=>x.id!==id);S.bases=S.bases.map(b=>b===id?null:b);const k=S.players.findIndex(x=>x.id===c);S.idx=k>=0?k:(S.players.length?S.idx%S.players.length:0);save();render()}
function mv(id,d){const i=S.players.findIndex(p=>p.id===id),j=i+d;if(j<0||j>=S.players.length)return;const c=cur().id;[S.players[i],S.players[j]]=[S.players[j],S.players[i]];S.idx=S.players.findIndex(p=>p.id===c);save();render()}
function delR(id){ask('¿Quitar del plantel?',()=>{if(P(id))fromLine(id,true);S.roster=S.roster.filter(x=>x.id!==id);save();render()},'Quitar')}
function seasonStats(){const m={};S.games.forEach(g=>g.players.forEach(p=>{const t=m[p.name]||(m[p.name]={name:p.name,GP:0,AB:0,H:0,s1:0,s2:0,s3:0,hr:0,BB:0,K:0,R:0,RBI:0,SAC:0});if(p.AB+p.BB+p.SAC+p.R>0)t.GP++;['AB','H','s1','s2','s3','hr','BB','K','R','RBI','SAC'].forEach(k=>t[k]+=p[k]||0)}));return Object.values(m).sort((a,b)=>b.H-a.H||b.AB-a.AB)}
function rec(){let w=0,l=0,e=0;S.games.forEach(g=>g.us>g.them?w++:g.us<g.them?l++:e++);return 'Récord '+w+'G - '+l+'P'+(e?' - '+e+'E':'')}
const AB_={sencillo:'1B',doble:'2B',triple:'3B','jonrón':'HR','base por bolas':'BB','llega por error':'E',ponchado:'K',out:'OUT',sacrificio:'SAC'};
const sc=p=>p.s1+2*p.s2+3*p.s3+4*p.hr+p.R+p.RBI+0.5*p.BB+0.5*p.SAC-0.25*p.K;
function mvp(ps){let b=null,v=0;ps.forEach(p=>{const x=sc(p);if(x>v||(b&&x===v&&x>0&&p.H>b.H)){b=p;v=x}});return b}

 updBtn()}
function cloudStop(){if(cloud.ref){cloud.ref.child('live').off();cloud.ref.child('meta').off()}cloud.ref=null;cloud.user=null;updBtn()}
const AERR={'auth/invalid-credential':'Correo o contraseña incorrectos','auth/wrong-password':'Contraseña incorrecta','auth/user-not-found':'No existe esa cuenta','auth/email-already-in-use':'Ese correo ya tiene cuenta, usa Entrar','auth/weak-password':'La contraseña debe tener al menos 6 caracteres','auth/invalid-email':'Correo no válido','auth/network-request-failed':'Sin conexión a internet'};
function cloudLogin(create){const e=document.getElementById('cl_e').value.trim(),p=document.getElementById('cl_p').value,m=document.getElementById('cl_m');m.textContent='';
 if(!e||!p){m.textContent='Escribe correo y contraseña';return}
 const a=firebase.auth();(create?a.createUserWithEmailAndPassword(e,p):a.signInWithEmailAndPassword(e,p)).then(()=>closeS()).catch(er=>{m.textContent=AERR[er.code]||('Error: '+(er.code||er.message))})}
function cloudLogout(){firebase.auth().signOut();closeS()}
function cloudSync(){flush(true);closeS()}
function cloudSheet(){let body;
 if(!cfgOk())body=`<h3>Nube (Firebase)</h3><div style="font-size:14px;color:var(--mu);margin-bottom:12px">Aún no está conectada. Pega tu configuración de Firebase en FIREBASE_CONFIG (dentro del archivo, cerca del final) y sube el archivo a tu hosting. Mientras tanto, la app guarda solo en este teléfono.</div><button class="btn" onclick="closeS()">Cerrar</button>`;
 else if(!cloud.user)body=`<h3>Iniciar sesión</h3><input id="cl_e" type="email" placeholder="Correo" autocomplete="username"><input id="cl_p" type="password" placeholder="Contraseña" autocomplete="current-password"><div id="cl_m" style="color:var(--rd);font-size:13px;min-height:18px;margin-bottom:6px"></div><button class="btn" onclick="cloudLogin(false)">Entrar</button><button class="btn" onclick="cloudLogin(true)">Crear cuenta</button><button class="btn" onclick="closeS()">Cerrar</button>`;
 else body=`<h3>Nube conectada</h3><div style="font-size:14px;color:var(--mu);margin-bottom:12px">${esc(cloud.user.email||'')}<br>${cloud.online?'Sincronizando en tiempo real':'Sin conexión: se enviará al reconectar'}</div><button class="btn" onclick="cloudSync()">Sincronizar ahora</button><button class="btn" style="color:var(--rd)" onclick="cloudLogout()">Cerrar sesión</button><button class="btn" onclick="closeS()">Cerrar</button>`;
 document.getElementById('sheet').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeS()"><div>${body}</div></div>`}
function cloudInit(){updBtn();if(!cfgOk())return;try{firebase.initializeApp(FIREBASE_CONFIG);cloud.db=firebase.database();
 cloud.db.ref('.info/connected').on('value',s=>{cloud.online=!!s.val();updBtn()});
 firebase.auth().onAuthStateChanged(u=>{if(u)cloudStart(u);else cloudStop()})}catch(e){console.error(e)}}
cloudInit();
</script>
</body></html>
