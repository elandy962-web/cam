function flush(force){
 if(!cloud.ref||!cloud.synced.live||!cloud.synced.meta||!cloud.synced.base||!cloud.synced.photos)return;
 const L=JSON.stringify(liveOf()),M=JSON.stringify(metaOf()),BS=JSON.stringify(S.base||null),PS=JSON.stringify(S.photos||{}),jobs=[];
 if(force||L!==cloud.lastLive){cloud.lastLive=L;jobs.push(cloud.ref.child('live').set(L))}

 if(force||BS!==cloud.lastBase){cloud.lastBase=BS;jobs.push(cloud.ref.child('base').set(BS))}

 cloud.pending+=jobs.length;
 jobs.forEach(j=>j.then(()=>{cloud.pending--;if(!cloud.pending&&!cloud.timer)setDirty(false);updBtn()}).catch(e=>{cloud.pending--;updBtn();console.error(e)}));
